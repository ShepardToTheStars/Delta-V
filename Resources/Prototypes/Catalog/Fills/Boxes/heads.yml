- type: entity
  name: circuit tote [QM]
  parent: ToteBase
  id: BoxQMCircuitboards
  description: A Tote filled with QM's Circuit boards.
  components:
  - type: StorageFill
    contents:
      - id: CargoBountyComputerCircuitboard
      - id: CargoRequestComputerCircuitboard
      - id: CargoSaleComputerCircuitboard
      - id: CargoShuttleConsoleCircuitboard
      - id: SalvageMagnetMachineCircuitboard
      # - id: SalvageJobBoardComputerCircuitboard # DeltaV - unneeded mechanic with mining points vendor
      - id: MailTeleporterMachineCircuitboard
      - id: LogisticsTechFabCircuitboard # DeltaV
      - id: MiningShuttleConsoleCircuitboard # DeltaV
      - id: SalvageExpeditionsComputerCircuitboard # DeltaV
      - id: FundingAllocationComputerCircuitboard # DeltaV - To be removed when it's in techvault on all maps

- type: entity
  name: stamp box [QM]
  parent: BoxCardboard
  id: BoxQMStamps
  description: A box filled with QM's Stamps. Stamped of course.
  components:
  - type: Item
    size: Small
    shape:
    - 0,0,1,1
  - type: StorageFill
    contents:
      - id: RubberStampApproved
      - id: RubberStampDenied
      - id: RubberStampQm
  - type: Storage
    grid:
    - 0,0,1,1
    whitelist:
      components:
      - Stamp
  - type: Sprite
    layers:
      - state: box
      - state: stamp

